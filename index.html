<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語クイズ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background-color: #f9f9f9;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .word {
            font-size: 28px;
            font-weight: bold;
            color: #0066cc;
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #e0e0e0;
        }
        .primary-btn {
            background-color: #0066cc;
            color: white;
            border: none;
            font-weight: bold;
        }
        .primary-btn:active {
            background-color: #004c99;
        }
        .secondary-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            font-weight: bold;
        }
        .secondary-btn:active {
            background-color: #5a6268;
        }
        .result-title {
            text-align: center;
            color: #2e7d32;
        }
        .feedback {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        .correct {
            color: #2e7d32;
        }
        .incorrect {
            color: #c62828;
        }
        .answer-detail {
            background: #f0f4f8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        /* 折りたたみ（エクスパンド）スタイルのデザイン */
        .wrong-words-card {
            margin-top: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 4px solid #c62828;
            overflow: hidden;
        }
        .wrong-words-details summary {
            padding: 16px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #c62828;
            cursor: pointer;
            user-select: none;
            outline: none;
        }
        .wrong-words-details summary:hover {
            background-color: #fff5f5;
        }
        .wrong-words-content {
            padding: 0 20px 20px 20px;
            border-top: 1px solid #eee;
        }
        .wrong-words-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .wrong-words-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .wrong-words-item:last-child {
            border-bottom: none;
        }
        .wrong-word-name {
            font-weight: bold;
            color: #0066cc;
        }
        .wrong-word-meaning {
            color: #555;
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h1 style="text-align: center;">英単語クイズ</h1>
        <button class="btn primary-btn" onclick="startQuiz()">スタート (5問)</button>
    </div>

    <!-- 間違えた単語表示エリア（デフォルトで折りたたみ） -->
    <div class="wrong-words-card" id="wrong-words-container" style="display: none;">
        <details class="wrong-words-details" id="wrong-words-details">
            <summary id="wrong-words-summary">❌ 間違えた単語 (0件)</summary>
            <div class="wrong-words-content">
                <ul class="wrong-words-list" id="wrong-words-list"></ul>
            </div>
        </details>
    </div>

    <script>
        const TOTAL_QUESTIONS = 5;
        let words = [];
        let currentIndex = 0;
        let score = 0;
        let currentChoices = []; 
        let wrongWordsMap = new Map(); // 重複を防ぐためのMap（単語 -> 正しい意味）

        async function loadTSV() {
            try {
                const response = await fetch('words.tsv');
                const text = await response.text();
                words = text.trim().split('\n').map(line => {
                    const parts = line.split('\t');
                    return {
                        word: parts[0]?.trim(),
                        correct: parts[1]?.trim(),
                        dummies: parts.slice(2, 5).map(d => d?.trim())
                    };
                }).filter(w => w.word && w.correct && w.dummies.length === 3);
            } catch (e) {
                alert('words.tsv の読み込みに失敗しました。');
            }
        }

        async function startQuiz() {
            await loadTSV();
            if (words.length === 0) {
                alert('問題データが見つからないか、フォーマットが不正です。');
                return;
            }
            words.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            prepareQuestion();
        }

        function prepareQuestion() {
            if (currentIndex >= TOTAL_QUESTIONS || currentIndex >= words.length) {
                showResult();
                return;
            }

            const current = words[currentIndex];
            currentChoices = [current.correct, ...current.dummies];
            currentChoices.sort(() => Math.random() - 0.5);

            showQuestion();
        }

        function showQuestion() {
            const current = words[currentIndex];

            let html = `<p style="text-align:right; color:#666;">第 ${currentIndex + 1} / ${TOTAL_QUESTIONS} 問</p>`;
            html += `<div class="word">${escapeHtml(current.word)}</div>`;
            
            currentChoices.forEach(choice => {
                html += `<button class="btn" onclick="checkAnswer('${escapeJs(choice)}', '${escapeJs(current.correct)}')">${escapeHtml(choice)}</button>`;
            });

            document.getElementById('app').innerHTML = html;
        }

        function checkAnswer(selected, correct) {
            const isCorrect = selected === correct;
            const current = words[currentIndex];

            if (isCorrect) {
                score++;
            } else {
                addWrongWord(current.word, current.correct);
            }

            let html = `<p style="text-align:right; color:#666;">第 ${currentIndex + 1} / ${TOTAL_QUESTIONS} 問</p>`;
            html += `<div class="word">${escapeHtml(current.word)}</div>`;
            
            if (isCorrect) {
                html += `<div class="feedback correct">⭕ 正解！</div>`;
            } else {
                html += `<div class="feedback incorrect">❌ 不正解...</div>`;
            }

            html += `<div class="answer-detail">正解: <strong>${escapeHtml(correct)}</strong></div>`;

            html += `<button class="btn secondary-btn" onclick="showQuestion()">同じ問題をもう一度やる</button>`;
            html += `<button class="btn primary-btn" onclick="nextQuestion()">新しい問題をやる</button>`;

            document.getElementById('app').innerHTML = html;
        }

        function addWrongWord(word, correct) {
            if (!wrongWordsMap.has(word)) {
                wrongWordsMap.set(word, correct);
                renderWrongWords();
            }
        }

        function renderWrongWords() {
            const container = document.getElementById('wrong-words-container');
            const summary = document.getElementById('wrong-words-summary');
            const list = document.getElementById('wrong-words-list');
            const details = document.getElementById('wrong-words-details');
            
            if (wrongWordsMap.size === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            // 自動で開かないようopen属性を解除して閉じる
            details.removeAttribute('open');

            summary.textContent = `❌ 間違えた単語 (${wrongWordsMap.size}件)`;

            let html = '';
            wrongWordsMap.forEach((meaning, word) => {
                html += `<li class="wrong-words-item">`;
                html += `<span class="wrong-word-name">${escapeHtml(word)}</span>`;
                html += `<span class="wrong-word-meaning">${escapeHtml(meaning)}</span>`;
                html += `</li>`;
            });
            list.innerHTML = html;
        }

        function nextQuestion() {
            currentIndex++;
            prepareQuestion();
        }

        function showResult() {
            const total = Math.min(TOTAL_QUESTIONS, words.length);
            const percentage = Math.round((score / total) * 100);
            
            let html = `<h2 style="text-align:center;">結果発表</h2>`;
            html += `<p style="text-align:center; font-size:20px;">初回の正解率: <strong>${score} / ${total} (${percentage}%)</strong></p>`;
            
            if (percentage === 100) {
                html += `<h3 class="result-title">🎉 素晴らしい！全問正解です！大変よくできました！ 🎉</h3>`;
            } else {
                html += `<p style="text-align:center;">次回は全問正解を目指しましょう！</p>`;
            }
            
            html += `<button class="btn primary-btn" onclick="startQuiz()">もう一度最初から挑戦する</button>`;
            
            document.getElementById('app').innerHTML = html;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJs(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
